" height="24" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="698" y="292" font-size="17" font-weight="700" fill="#BB361F">3 执行阶段：读取 → 拆解 → 形成结论 → 核对 → 保留</text><rect x="816" y="537" width="458" height="38" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="828" y="562" font-size="17" font-weight="700" fill="#BB361F">4 待办入口：先选引用位置，再继续</text><rect x="1035" y="733" width="476" height="38" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="1047" y="758" font-size="17" font-weight="700" fill="#BB361F">5 分支：只处理选中项，其余成果保留</text><rect x="516" y="851" width="600" height="47" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="528" y="880.5" font-size="17" font-weight="700" fill="#BB361F">6 成果与版本：查看草稿 / 历史，不覆盖旧成果</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160"><g font-family="Microsoft YaHei, Arial, sans-serif"><rect width="3840" height="2160" fill="#FFFFFF"/><text x="96" y="116" font-size="68" fill="#182230" font-weight="700">01  任务进展</text><text x="96" y="184" font-size="36" fill="#526174" font-weight="400">先看当前进展，再处理真正需要人工介入的事项</text><text text-anchor="end" x="3744" y="117" font-size="32" fill="#1557D2" font-weight="700">OFFICE AGENT</text><rect x="96" y="235" width="3648" height="86" fill="#F0F5FD"/><text x="127" y="291" font-size="36" fill="#1557D2" font-weight="700">操作流程</text><circle cx="430" cy="278" r="24" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="430" y="292" font-size="40" fill="#FFFFFF" font-weight="700">1</text><text x="476" y="292" font-size="34" fill="#182230" font-weight="400">查看当前进展</text><text x="1161" y="292" font-size="40" fill="#8A99AD" font-weight="400">→</text><circle cx="1248" cy="278" r="24" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="1248" y="292" font-size="40" fill="#FFFFFF" font-weight="700">2</text><text x="1294" y="292" font-size="34" fill="#182230" font-weight="400">定位待确认事项</text><text x="1979" y="292" font-size="40" fill="#8A99AD" font-weight="400">→</text><circle cx="2066" cy="278" r="24" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2066" y="292" font-size="40" fill="#FFFFFF" font-weight="700">3</text><text x="2112" y="292" font-size="34" fill="#182230" font-weight="400">点击确认引用位置</text><text x="2797" y="292" font-size="40" fill="#8A99AD" font-weight="400">→</text><circle cx="2884" cy="278" r="24" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2884" y="292" font-size="40" fill="#FFFFFF" font-weight="700">4</text><text x="2930" y="292" font-size="34" fill="#182230" font-weight="400">核对后按分支继续</text><text x="150" y="367" font-size="28" fill="#526174" font-weight="400">页面截图 · 蓝色字母对应右侧说明</text><text x="2785" y="367" font-size="32" fill="#1557D2" font-weight="700">模块含义</text><rect x="148" y="388" width="2512" height="1414" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="432" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="446" font-size="40" fill="#FFFFFF" font-weight="700">A</text><text x="2870" y="447" font-size="42" fill="#182230" font-weight="700">任务与运行上下文</text><text x="2785" y="518" font-size="35" fill="#526174" font-weight="400">顶部显示任务目标、当前 Run 和状态；</text><text x="2785" y="573" font-size="35" fill="#526174" font-weight="400">返回资料库或查看其他运行，不混淆任务。</text><line x1="2785" y1="610" x2="3744" y2="610" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="651" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="665" font-size="40" fill="#FFFFFF" font-weight="700">B</text><text x="2870" y="666" font-size="42" fill="#182230" font-weight="700">能力视图切换</text><text x="2785" y="737" font-size="35" fill="#526174" font-weight="400">执行进展看任务推进；协作方式看分工。</text><text x="2785" y="792" font-size="35" fill="#526174" font-weight="400">两者是同一任务的不同视图，不是新系统。</text><line x1="2785" y1="829" x2="3744" y2="829" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="870" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="884" font-size="40" fill="#FFFFFF" font-weight="700">C</text><text x="2870" y="885" font-size="42" fill="#182230" font-weight="700">五阶段进展</text><text x="2785" y="956" font-size="35" fill="#526174" font-weight="400">读取、拆解、形成结论、核对依据、保留成果。</text><text x="2785" y="1011" font-size="35" fill="#526174" font-weight="400">阶段状态分别判断，有草稿不等于任务完成。</text><line x1="2785" y1="1048" x2="3744" y2="1048" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="1089" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="1103" font-size="40" fill="#FFFFFF" font-weight="700">D</text><text x="2870" y="1104" font-size="42" fill="#182230" font-weight="700">当前待办与主操作</text><text x="2785" y="1175" font-size="35" fill="#526174" font-weight="400">说明为什么要确认、涉及哪些资料。</text><text x="2785" y="1230" font-size="35" fill="#526174" font-weight="400">点击「确认引用位置」进入专注核对页。</text><line x1="2785" y1="1267" x2="3744" y2="1267" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="1308" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="1322" font-size="40" fill="#FFFFFF" font-weight="700">E</text><text x="2870" y="1323" font-size="42" fill="#182230" font-weight="700">分支进展</text><text x="2785" y="1394" font-size="35" fill="#526174" font-weight="400">每项展示子任务、批准资料和等待状态。</text><text x="2785" y="1449" font-size="35" fill="#526174" font-weight="400">按需要处理一条分支，不重做无关成果。</text><line x1="2785" y1="1486" x2="3744" y2="1486" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="1527" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="1541" font-size="40" fill="#FFFFFF" font-weight="700">F</text><text x="2870" y="1542" font-size="42" fill="#182230" font-weight="700">当前成果与版本历史</text><text x="2785" y="1613" font-size="35" fill="#526174" font-weight="400">查看已保留的简报和历史版本。</text><text x="2785" y="1668" font-size="35" fill="#526174" font-weight="400">逻辑成果不代表原文件已被改写。</text><line x1="96" y1="1870" x2="3744" y2="1870" stroke="#DCE3EC" stroke-width="2"/><text x="96" y="1930" font-size="34" fill="#182230" font-weight="400">入口：办公资料库提交任务后，打开 Agent 能力页的「执行进展」。</text><text x="96" y="1993" font-size="34" fill="#008260" font-weight="700">读图要点：橙色表示待处理；草稿保留与任务完成是两件事。</text><text x="96" y="2080" font-size="28" fill="#526174" font-weight="400">原系统 React 页面，2026-09-11 受控测试截图；数字与状态来自测试数据，不代表真实模型任务成功。</text><text text-anchor="end" x="3744" y="2080" font-size="28" fill="#526174" font-weight="400">01 / 04</text></g></svg>
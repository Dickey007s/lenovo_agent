<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160"><g font-family="Microsoft YaHei, Arial, sans-serif"><rect width="3840" height="2160" fill="#FFFFFF"/><text x="96" y="116" font-size="68" fill="#182230" font-weight="700">04  证据核对</text><text x="96" y="184" font-size="36" fill="#526174" font-weight="400">人工只决定需要自己判断的原文位置，不替 Agent 猜测，也不授权外发</text><text text-anchor="end" x="3744" y="117" font-size="32" fill="#1557D2" font-weight="700">OFFICE AGENT</text><rect x="96" y="235" width="3648" height="86" fill="#F0F5FD"/><text x="127" y="291" font-size="36" fill="#1557D2" font-weight="700">操作流程</text><circle cx="430" cy="278" r="24" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="430" y="292" font-size="40" fill="#FFFFFF" font-weight="700">1</text><text x="476" y="292" font-size="34" fill="#182230" font-weight="400">读清原因和影响</text><text x="1161" y="292" font-size="40" fill="#8A99AD" font-weight="400">→</text><circle cx="1248" cy="278" r="24" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="1248" y="292" font-size="40" fill="#FFFFFF" font-weight="700">2</text><text x="1294" y="292" font-size="34" fill="#182230" font-weight="400">比较两处原文</text><text x="1979" y="292" font-size="40" fill="#8A99AD" font-weight="400">→</text><circle cx="2066" cy="278" r="24" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2066" y="292" font-size="40" fill="#FFFFFF" font-weight="700">3</text><text x="2112" y="292" font-size="34" fill="#182230" font-weight="400">主动选择一个位置</text><text x="2797" y="292" font-size="40" fill="#8A99AD" font-weight="400">→</text><circle cx="2884" cy="278" r="24" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2884" y="292" font-size="40" fill="#FFFFFF" font-weight="700">4</text><text x="2930" y="292" font-size="34" fill="#182230" font-weight="400">确认选择或暂不处理</text><text x="150" y="367" font-size="28" fill="#526174" font-weight="400">页面截图 · 蓝色字母对应右侧说明</text><text x="2785" y="367" font-size="32" fill="#1557D2" font-weight="700">模块含义</text><rect x="148" y="388" width="2512" height="1414" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="432" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="446" font-size="40" fill="#FFFFFF" font-weight="700">A</text><text x="2870" y="447" font-size="42" fill="#182230" font-weight="700">为什么需要人参与</text><text x="2785" y="518" font-size="35" fill="#526174" font-weight="400">左上解释发现了什么、影响哪里、需要做什么。</text><text x="2785" y="573" font-size="35" fill="#526174" font-weight="400">先理解问题，再决定引用位置。</text><line x1="2785" y1="610" x2="3744" y2="610" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="651" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="665" font-size="40" fill="#FFFFFF" font-weight="700">B</text><text x="2870" y="666" font-size="42" fill="#182230" font-weight="700">保留项与操作边界</text><text x="2785" y="737" font-size="35" fill="#526174" font-weight="400">说明哪些成果和历史保留，哪些动作不会发生。</text><text x="2785" y="792" font-size="35" fill="#526174" font-weight="400">不改原文件，也不重做无关已完成分支。</text><line x1="2785" y1="829" x2="3744" y2="829" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="870" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="884" font-size="40" fill="#FFFFFF" font-weight="700">C</text><text x="2870" y="885" font-size="42" fill="#182230" font-weight="700">待核对判断与来源</text><text x="2785" y="956" font-size="35" fill="#526174" font-weight="400">右上显示尚未确认的判断，以及对应文件。</text><text x="2785" y="1011" font-size="35" fill="#526174" font-weight="400">展示出来的候选判断，不等于已被验证。</text><line x1="2785" y1="1048" x2="3744" y2="1048" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="1089" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="1103" font-size="40" fill="#FFFFFF" font-weight="700">D</text><text x="2870" y="1104" font-size="42" fill="#182230" font-weight="700">候选位置与原文</text><text x="2785" y="1175" font-size="35" fill="#526174" font-weight="400">两处原文并列，单选按钮起初都不选中。</text><text x="2785" y="1230" font-size="35" fill="#526174" font-weight="400">用户对照上下文，主动选择一处。</text><line x1="2785" y1="1267" x2="3744" y2="1267" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="1308" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="1322" font-size="40" fill="#FFFFFF" font-weight="700">E</text><text x="2870" y="1323" font-size="42" fill="#182230" font-weight="700">在文件中查看</text><text x="2785" y="1394" font-size="35" fill="#526174" font-weight="400">打开安全原文预览，核对上下文和具体位置。</text><text x="2785" y="1449" font-size="35" fill="#526174" font-weight="400">查看不等于选中，更不等于批准。</text><line x1="2785" y1="1486" x2="3744" y2="1486" stroke="#DCE3EC" stroke-width="2"/><circle cx="2815" cy="1527" r="30" fill="#1557D2" stroke="#FFFFFF" stroke-width="4"/><text text-anchor="middle" x="2815" y="1541" font-size="40" fill="#FFFFFF" font-weight="700">F</text><text x="2870" y="1542" font-size="42" fill="#182230" font-weight="700">选择状态与确认操作</text><text x="2785" y="1613" font-size="35" fill="#526174" font-weight="400">底部显示选择状态；未选时不能确认。</text><text x="2785" y="1668" font-size="35" fill="#526174" font-weight="400">也可暂不处理返回，保留问题和已有成果。</text><line x1="96" y1="1870" x2="3744" y2="1870" stroke="#DCE3EC" stroke-width="2"/><text x="96" y="1930" font-size="34" fill="#182230" font-weight="400">入口：从任务进展的「确认引用位置」，或执行记录的「处理这一项」进入。</text><text x="96" y="1993" font-size="34" fill="#008260" font-weight="700">读图要点：确认的是证据位置，不是业务批准；若 Run 已结束，还需显式创建同任务的新 Run 续办。</text><text x="96" y="2080" font-size="28" fill="#526174" font-weight="400">原系统 React 页面，2026-09-11 受控测试截图；原文位置由系统提供，标注没有改写任何界面内容。</text><text text-anchor="end" x="3744" y="2080" font-size="28" fill="#526174" font-weight="400">04 / 04</text></g></svg>
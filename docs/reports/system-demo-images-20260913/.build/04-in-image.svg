<svg xmlns="http://www.w3.org/2000/svg" width="3344" height="1880" viewBox="0 0 1672 940"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#BB361F"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="1040" y="102" width="560" height="65" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="1056" y="129" font-size="17" font-weight="700" fill="#BB361F">读原因 → 比较原文 → 主动单选 → 确认 / 暂缓</text><text x="1056" y="151" font-size="12.5" fill="#735F57">操作流程 · 红色为后加说明 · 原系统受控测试截图</text><path d="M158 814 H51 V320 H65" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1093 236 H984 V227 H962" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1070 517 H993 V508 H976" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M856 417 V425 H617 V416" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1450 574 H1621 V405 H1595" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1499 837 H1618 V864 H1540 V882" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="158" y="783" width="345" height="61" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="170" y="808.5" font-size="17" font-weight="700" fill="#BB361F">1 先读原因、影响与边界</text><text x="170" y="831.5" font-size="15" font-weight="400" fill="#5F4942">只选依据，不改原件、不授权外发</text><rect x="1093" y="209" width="470" height="61" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="1105" y="234.5" font-size="17" font-weight="700" fill="#BB361F">2 待核对判断</text><text x="1105" y="257.5" font-size="15" font-weight="400" fill="#5F4942">是候选结论，不是已验证事实</text><rect x="1070" y="483" width="492" height="72" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="1082" y="514" font-size="17" font-weight="700" fill="#BB361F">3 比较两处原文与上下文</text><text x="1082" y="537" font-size="15" font-weight="400" fill="#5F4942">看清第 9 行与第 14 行为何重复</text><rect x="830" y="370" width="538" height="47" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="842" y="399.5" font-size="17" font-weight="700" fill="#BB361F">4 主动单选：未选中时，确认按钮禁用</text><rect x="1121" y="574" width="469" height="38" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="1133" y="599" font-size="17" font-weight="700" fill="#BB361F">5 查看原文：只是预览，不会自动选中</text><rect x="829" y="815" width="670" height="44" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="841" y="843" font-size="17" font-weight="700" fill="#BB361F">6 确认 / 暂缓：记录选择；终态任务需另建 Run 续办</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="2200" viewBox="0 0 1440 1100"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#BB361F"/></marker></defs><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="790" y="92" width="548" height="65" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="806" y="119" font-size="17" font-weight="700" fill="#BB361F">看分工与依赖 → 确认本批 → 查看贡献采用</text><text x="806" y="141" font-size="12.5" fill="#735F57">操作流程 · 红色为后加说明 · 原系统受控测试截图</text><path d="M795 212 H750 V229 H670" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M745 383 V352" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M520 666 H311" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M404 741 H508" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1228 416 V435" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1226 889 V861" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M760 985 V1000" fill="none" stroke="#BB361F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="795" y="190" width="542" height="43" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="807" y="217.5" font-size="17" font-weight="700" fill="#BB361F">1 协作范围：单进程只读，每批最多 3 个</text><rect x="545" y="383" width="504" height="35" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="557" y="406.5" font-size="17" font-weight="700" fill="#BB361F">2 调用与采用分开：返回不等于进入成果</text><rect x="520" y="648" width="542" height="36" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="532" y="672" font-size="17" font-weight="700" fill="#BB361F">3 工作包：每个框是一项分工及其当前状态</text><rect x="72" y="711" width="332" height="68" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="84" y="740" font-size="17" font-weight="700" fill="#BB361F">4 连线表示前置依赖</text><text x="84" y="763" font-size="15" font-weight="400" fill="#5F4942">不是多个 Worker 正在并行</text><rect x="1110" y="382" width="235" height="34" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="1122" y="405" font-size="17" font-weight="700" fill="#BB361F">5 看谁受阻、谁可继续</text><rect x="1111" y="889" width="230" height="77" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="1123" y="922.5" font-size="17" font-weight="700" fill="#BB361F">6 确认本批后才执行</text><text x="1123" y="945.5" font-size="15" font-weight="400" fill="#5F4942">就绪不等于已经派发</text><rect x="520" y="951" width="520" height="34" rx="4" fill="#FFF8F0" fill-opacity="0.97" stroke="#BB361F" stroke-width="1.5"/><text x="532" y="974" font-size="17" font-weight="700" fill="#BB361F">7 协作结果：已返回 / 已采用 / 成果版本</text></g></svg>
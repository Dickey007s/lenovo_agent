    <text x="838" y="552" font-size="28" font-weight="700" fill="#1557D2" data-width="394">下一步验证</text>
    <text x="838" y="596" font-size="24" fill="#182230" data-width="394">漏问、无谓打扰、反馈利用</text>
    <text x="838" y="632" font-size="24" fill="#182230" data-width="394">越权拦截与真人理解测试</text>
  </g>

    <text x="738" y="292" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">调度与动作</text>
    <text x="718" y="330" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="15" fill="#5A6B7C">queue / lease / Worker</text><text x="718" y="358" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7C">Tool / Connector / Permit</text><text x="718" y="386" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">幂等回执</text>


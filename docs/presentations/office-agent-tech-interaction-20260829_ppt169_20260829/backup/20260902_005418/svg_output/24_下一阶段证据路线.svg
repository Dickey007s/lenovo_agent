<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F8FA"/><rect x="0" y="0" width="18" height="720" fill="#1769E0"/></g>
  <g id="header">
    <text x="52" y="82" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="46" font-weight="700" fill="#132A3A">下一阶段：把 07-16 方向变成可证伪证据</text>
    <text x="52" y="126" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="24" fill="#5A6B7C">先闭合可信失败与恢复，再扩大业务效果和外部动作。</text>
  </g>

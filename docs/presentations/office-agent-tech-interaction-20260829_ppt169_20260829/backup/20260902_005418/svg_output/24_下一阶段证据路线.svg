  <g id="closing-statement">
    <text x="52" y="522" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="32" font-weight="700" fill="#132A3A">Office Agent 的产品，不是一段回答；</text>
    <text x="52" y="566" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="32" font-weight="700" fill="#1769E0">而是一份可复核、可恢复、可追责的当前工作结论。</text>
  </g>
  <g id="non-claims">
    <rect x="52" y="610" width="1176" height="44" rx="6" fill="#EDF1F4"/>
    <text x="76" y="638" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">当前不证明全面领先　·　不证明生产 SLA　·　不证明用户已经更信任或更高效</text>

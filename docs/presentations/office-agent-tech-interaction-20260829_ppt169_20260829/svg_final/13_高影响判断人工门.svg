<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F8FA" /><path d="M52 112H1228" stroke="#CBD5DF" stroke-width="2" /></g>
  <g id="header">
    <text x="52" y="78" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="46" font-weight="700" fill="#132A3A">TC-06 / TC-07：高影响判断必须保留人工门</text>
    <path fill="#EDF1F4" d="M1078,46 H1222 A6,6 0 0 1 1228,52 V74 A6,6 0 0 1 1222,80 H1078 A6,6 0 0 1 1072,74 V52 A6,6 0 0 1 1078,46 Z" /><text x="1150" y="69" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1769E0">人机责任分层</text>
  </g>
  <g id="recruiting-scenario">
    <path fill="#FFFFFF" stroke="#1769E0" stroke-width="2" d="M58,146 H606 A6,6 0 0 1 612,152 V588 A6,6 0 0 1 606,594 H58 A6,6 0 0 1 52,588 V152 A6,6 0 0 1 58,146 Z" />
    
  <g transform="translate(80, 174) scale(1.41667)" fill="none" stroke="#1769E0" stroke-width="2">
    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
    <path d="M6 21v-2a4 4 0 0 1 4 -4h4" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="130" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#132A3A">TC-06 · 双岗位招聘筛选</text>
    <path d="M80 226H584" stroke="#E3E8ED" stroke-width="2" />
    <text x="80" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1769E0">触发</text><text x="142" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">两份 JD + 五份简历，形成候选建议</text>
    <text x="80" y="302" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1769E0">路径</text><text x="142" y="302" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">职位条件 → 经历证据 → 匹配/缺口 → 建议台账</text>
    <text x="80" y="344" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#2E7D32">输出</text><text x="142" y="344" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">候选顺序、支持证据、缺失信息、复核项</text>
    <text x="80" y="386" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#B54708">停顿</text><text x="142" y="386" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">材料冲突或关键条件缺失时标为待复核</text>
    <text x="80" y="428" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1769E0">用户动作</text><text x="174" y="428" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">回开依据，确认或改写筛选规则</text>
    <path fill="#EDF1F4" d="M86,464 H578 A6,6 0 0 1 584,470 V554 A6,6 0 0 1 578,560 H86 A6,6 0 0 1 80,554 V470 A6,6 0 0 1 86,464 Z" />
    <text x="100" y="496" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">前台必须明确</text>
    <text x="100" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">这是建议，不是录用/淘汰；不隐藏不确定性与隐私边界。</text>
  </g>
  <g id="legal-scenario">
    <path fill="#FFFFFF" stroke="#D97706" stroke-width="2" d="M646,146 H1222 A6,6 0 0 1 1228,152 V588 A6,6 0 0 1 1222,594 H646 A6,6 0 0 1 640,588 V152 A6,6 0 0 1 646,146 Z" />
    
  <g transform="translate(668, 174) scale(1.41667)" fill="none" stroke="#D97706" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="718" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#132A3A">TC-07 · 授权文件风控</text>
    <path d="M668 226H1200" stroke="#E3E8ED" stroke-width="2" />
    <text x="668" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#D97706">触发</text><text x="730" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">六份授权文件，核对授权范围与风险</text>
    <text x="668" y="302" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#D97706">路径</text><text x="730" y="302" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">条款抽取 → 原文定位 → 规则台账 → 风险候选</text>
    <text x="668" y="344" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#2E7D32">输出</text><text x="730" y="344" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">文件级规则、来源位置、冲突与复核清单</text>
    <text x="668" y="386" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#B54708">停顿</text><text x="730" y="386" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">授权主体/期限/范围不一致时不自动裁决</text>
    <text x="668" y="428" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#D97706">用户动作</text><text x="762" y="428" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">逐项回开原文，交由法务作最终判断</text>
    <path fill="#EDF1F4" stroke="#D97706" stroke-width="2" d="M674,464 H1194 A6,6 0 0 1 1200,470 V554 A6,6 0 0 1 1194,560 H674 A6,6 0 0 1 668,554 V470 A6,6 0 0 1 674,464 Z" />
    <text x="688" y="496" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">前台必须明确</text>
    <text x="688" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">这是风险候选，不代表法律意见，也不会代替签署。</text>
  </g>
  <g id="shared-principle">
    <path d="M52 630H1228" stroke="#1769E0" stroke-width="4" />
    <text x="52" y="660" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">共同原则：Agent 提供证据与候选，业务权威仍由有职责的人承担。</text>
  </g>
  <g id="footer">
    <text x="52" y="690" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14" fill="#7C8A98">人机交互研究依据：Microsoft Guidelines for Human-AI Interaction</text>
    <text x="1228" y="690" text-anchor="end" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#7C8A98">13 / 24</text>
  </g>
</svg>
    <circle cx="100" cy="260" r="18" fill="#C0362C" /><text x="100" y="267" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="132" y="256" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">方向漂移</text>
    <text x="132" y="288" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">中间目标逐步偏离 Task Contract</text>
    <circle cx="448" cy="260" r="18" fill="#C0362C" /><text x="448" y="267" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="480" y="256" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">上下文退化</text>
    <text x="480" y="288" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">旧版本、噪声与关键约束丢失</text>
    <circle cx="100" cy="374" r="18" fill="#D97706" /><text x="100" y="381" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="132" y="370" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">错误复利</text>
    <text x="132" y="402" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">未经验证的事实进入后续成果</text>
    <circle cx="448" cy="374" r="18" fill="#D97706" /><text x="448" y="381" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="480" y="370" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">成本扩张</text>
    <text x="480" y="402" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">重试、工具与分支持续增长</text>
    <circle cx="100" cy="488" r="18" fill="#B54708" /><text x="100" y="495" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
    <text x="132" y="484" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">权限漂移</text>
    <text x="132" y="516" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">工具链扩展后超出原始授权</text>
    <circle cx="448" cy="488" r="18" fill="#B54708" /><text x="448" y="495" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
    <text x="480" y="484" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">停止困难</text>
    <text x="480" y="516" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">局部失败牵连整任务，用户难接管</text>
  </g>

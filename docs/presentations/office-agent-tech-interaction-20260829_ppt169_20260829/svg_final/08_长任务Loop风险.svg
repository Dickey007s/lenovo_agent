  </g>
  <g id="risk-matrix">
    <path fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2" d="M58,154 H790 A6,6 0 0 1 796,160 V578 A6,6 0 0 1 790,584 H58 A6,6 0 0 1 52,578 V160 A6,6 0 0 1 58,154 Z" />

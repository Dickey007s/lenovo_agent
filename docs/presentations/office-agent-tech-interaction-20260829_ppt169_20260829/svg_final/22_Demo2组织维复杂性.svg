    <text x="914" y="566" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">当前是单 Controller + 固定适配器；</text>
    <text x="914" y="590" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">通用多 Worker 自组织仍是目标。</text>
  </g>

  <g id="takeaway">
    <path fill="#132A3A" d="M58,630 H1222 A6,6 0 0 1 1228,636 V656 A6,6 0 0 1 1222,662 H58 A6,6 0 0 1 52,656 V636 A6,6 0 0 1 58,630 Z" />

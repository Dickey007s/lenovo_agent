    <text x="458" y="308" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">审：研究计划、来源、进度与报告</text>
    <text x="458" y="340" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1769E0">交互对象：可中断的研究过程</text>

    <rect x="820" y="224" width="408" height="158" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>

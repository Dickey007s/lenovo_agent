  <g id="office-agent-position">
    <path d="M52 610H1228" stroke="#1769E0" stroke-width="4"/>
    <text x="52" y="640" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">Office Agent 候选差异：用户审的是“资料 → 业务结论 → 成果 → 人工决定 → 未执行边界”</text>

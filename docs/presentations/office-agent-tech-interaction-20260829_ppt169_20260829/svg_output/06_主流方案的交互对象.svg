    <text x="74" y="308" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">审：文件、邮件、会议、站点与人员</text>
    <text x="74" y="340" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1769E0">交互对象：工作内容与引用范围</text>

    <rect x="436" y="224" width="360" height="158" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>

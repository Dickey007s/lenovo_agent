    <text x="458" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">审：Gateway Task、路由、会话与审批</text>
    <text x="458" y="522" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#B54708">交互对象：任务账本与运行通道</text>

    <rect x="820" y="406" width="408" height="158" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>

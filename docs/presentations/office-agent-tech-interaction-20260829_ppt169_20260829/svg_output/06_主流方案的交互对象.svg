    <text x="52" y="188" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">官方材料可以说明产品重心，不能据此推出竞品做不到其他能力。</text>
  </g>

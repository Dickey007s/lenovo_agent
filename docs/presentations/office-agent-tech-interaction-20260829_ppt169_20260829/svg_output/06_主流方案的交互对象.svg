    <text x="842" y="308" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">审：Task、隔离工作区、Diff 与队列</text>
    <text x="842" y="340" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1769E0">交互对象：代码任务与可审查变更</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect width="1280" height="720" fill="#F7F8FA"/>
    <path d="M52 112H1228" fill="none" stroke="#CBD5DF" stroke-width="2"/>
  </g>
  <g id="header">
    <text x="52" y="78" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="44" font-weight="700" fill="#132A3A">Demo 3：动作维风险，方案与执行必须隔离</text>
    <rect x="1072" y="45" width="156" height="34" rx="6" fill="#EDF1F4"/>
    <text x="1150" y="68" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1769E0">07-16 目标演示</text>
    <text x="52" y="146" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">生成建议、形成草稿和真实发送或付款是三种不同事实；风险越高，用户越需要在动作发生前看见影响。</text>
  </g>

  <g id="risk-levels">
    <text x="52" y="188" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">L0-L5 把风险映射为不同交互</text>
    <rect x="52" y="208" width="188" height="64" rx="6" fill="#EDF1F4" stroke="#2E7D32" stroke-width="2"/>
    <text x="72" y="234" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#2E7D32">L0</text>
    <text x="112" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">自动执行</text>
    <rect x="250" y="208" width="188" height="64" rx="6" fill="#EDF1F4" stroke="#2E7D32" stroke-width="2"/>
    <text x="270" y="234" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#2E7D32">L1</text>
    <text x="310" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">执行并通知</text>
    <rect x="448" y="208" width="188" height="64" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/>
    <text x="468" y="234" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#1769E0">L2</text>
    <text x="508" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">只生成草稿</text>
    <rect x="646" y="208" width="188" height="64" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="666" y="234" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#B54708">L3</text>
    <text x="706" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">普通确认</text>
    <rect x="844" y="208" width="188" height="64" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="864" y="234" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#B54708">L4</text>
    <text x="904" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">强确认</text>
    <rect x="1042" y="208" width="186" height="64" rx="6" fill="#FFFFFF" stroke="#C0362C" stroke-width="2"/>
    <text x="1062" y="234" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#C0362C">L5</text>
    <text x="1102" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">直接拒绝</text>
  </g>

  <g id="action-gate-flow">
    <text x="52" y="310" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">动作链：先让用户看见影响，再决定是否发放 Permit</text>
    <rect x="52" y="330" width="1176" height="84" rx="6" fill="#132A3A"/>
    <text x="78" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">方案</text>
    <path d="M128 372H164" fill="none" stroke="#CBD5DF" stroke-width="3"/><path d="M164 372L154 366V378Z" fill="#CBD5DF"/>
    <text x="182" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">影响预览</text>
    <path d="M276 372H312" fill="none" stroke="#CBD5DF" stroke-width="3"/><path d="M312 372L302 366V378Z" fill="#CBD5DF"/>
    <text x="330" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Risk Lens</text>
    <path d="M422 372H458" fill="none" stroke="#CBD5DF" stroke-width="3"/><path d="M458 372L448 366V378Z" fill="#CBD5DF"/>
    <text x="476" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Evidence Gate</text>
    <path d="M602 372H638" fill="none" stroke="#CBD5DF" stroke-width="3"/><path d="M638 372L628 366V378Z" fill="#CBD5DF"/>
    <text x="656" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">人工确认</text>
    <path d="M748 372H784" fill="none" stroke="#D97706" stroke-width="3"/><path d="M784 372L774 366V378Z" fill="#D97706"/>
    <text x="802" y="380" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#FFFFFF">Permit</text>
    <path d="M876 372H912" fill="none" stroke="#2E7D32" stroke-width="3"/><path d="M912 372L902 366V378Z" fill="#2E7D32"/>
    <text x="930" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">执行回执</text>
    <text x="1050" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14" fill="#CBD5DF">或明确“未发生”</text>
  </g>

  <g id="current-interface">
    <rect x="52" y="440" width="678" height="194" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
    <image href="../images/scenario-effect-gate-desktop.png" x="62" y="450" width="658" height="174" preserveAspectRatio="xMidYMid meet"/>
    <rect x="70" y="458" width="186" height="30" rx="6" fill="#2E7D32"/>
    <text x="163" y="479" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">当前有限实现：成果与效果边界</text>
  </g>
  <g id="current-boundary">
    <rect x="754" y="440" width="474" height="194" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>
    <text x="778" y="476" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">当前已经能证明什么</text>
    <use data-icon="tabler-outline/circle-check" x="778" y="494" width="24" height="24" fill="#2E7D32" stroke-width="2"/>
    <text x="814" y="512" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">实际 Artifact、具名 Validator、EffectReceipt</text>
    <use data-icon="tabler-outline/circle-check" x="778" y="526" width="24" height="24" fill="#2E7D32" stroke-width="2"/>
    <text x="814" y="544" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#1B2733">前台明确展示“已生成”与“外部动作未发生”</text>
    <path d="M778 560H1204" fill="none" stroke="#E3E8ED" stroke-width="2"/>
    <use data-icon="tabler-outline/alert-triangle" x="778" y="574" width="24" height="24" fill="#D97706" stroke-width="2"/>
    <text x="814" y="590" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#B54708">生产 Connector、身份授权、Permit 防重放仍未实现</text>
    <text x="814" y="614" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14" fill="#5A6B7C">因此当前不执行真实付款、发送、CRM 或生产变更。</text>
  </g>

  <g id="takeaway">
    <rect x="52" y="646" width="1176" height="28" rx="6" fill="#EDF1F4"/>
    <text x="640" y="666" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">交互变化：按钮不再只写“确认”，而要说明对象、影响、可逆性、证据、风险级别和动作回执。</text>
  </g>
  <g id="footer">
    <text x="52" y="704" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14" fill="#7C8A98">目标结构来源：07-16 Demo 3；线上实践依据：OpenAI Agents SDK Human-in-the-loop · MCP Elicitation</text>
    <text x="1228" y="704" text-anchor="end" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#7C8A98">23 / 24</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect width="1280" height="720" fill="#F7F8FA"/>
    <path d="M52 112H1228" stroke="#CBD5DF" stroke-width="2"/>
  </g>
  <g id="header">
    <text x="52" y="78" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="46" font-weight="700" fill="#132A3A">实操 2：证据有歧义，只恢复受影响的分支</text>
  </g>
  <g id="review-screenshot">
    <rect x="52" y="140" width="792" height="528" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>
    <image href="../images/dr-0037-review-readability-desktop.png" x="62" y="150" width="772" height="508" preserveAspectRatio="xMidYMid meet"/>
    <rect x="72" y="160" width="170" height="32" rx="6" fill="#D97706"/>
    <text x="157" y="182" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">证据复核实景</text>
  </g>
  <g id="review-explanation">
    <rect x="872" y="140" width="356" height="126" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="896" y="176" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">先解释发生了什么</text>
    <text x="896" y="212" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">同一逐字片段出现多次，服务端无法</text>
    <text x="896" y="240" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">唯一决定该回开哪一处原文。</text>

    <rect x="872" y="282" width="356" height="126" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/>
    <text x="896" y="318" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">再让用户决定位置</text>
    <text x="896" y="354" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">界面同时给出事实、影响、下一步，</text>
    <text x="896" y="382" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">并在安全预览中高亮候选原文。</text>

    <rect x="872" y="424" width="356" height="168" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>
    <image href="../images/dr-0034-mixed-branch-actions-desktop.png" x="882" y="434" width="336" height="159" preserveAspectRatio="xMidYMid meet"/>
    <rect x="886" y="440" width="128" height="30" rx="6" fill="#132A3A"/>
    <text x="950" y="461" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">分支动作实景</text>

    <rect x="872" y="608" width="356" height="60" rx="6" fill="#EDF1F4"/>
    <text x="896" y="634" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#2E7D32">只改变目标 Branch</text>
    <text x="896" y="656" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14" fill="#5A6B7C">已完成成果和其他分支继续保留。</text>
  </g>
  <g id="footer">
    <text x="52" y="690" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14" fill="#7C8A98">用户确认的是原文位置，不是替 Agent 为结论背书；来源版本变化会进入 stale 并重新核对</text>
    <text x="1228" y="690" text-anchor="end" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#7C8A98">19 / 24</text>
  </g>
</svg>

  </g>
  <g id="operation-screenshot">
    <rect x="52" y="140" width="792" height="528" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>
    <image href="../images/dr-0036-tc01-live-run-completed.png" x="62" y="150" width="772" height="508" preserveAspectRatio="xMidYMid meet"/>

  </g>
  <g id="callouts">
    <rect x="872" y="140" width="356" height="132" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/>
    <circle cx="902" cy="174" r="18" fill="#1769E0"/>
    <text x="902" y="181" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
    <text x="932" y="181" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">用户动作</text>
    <text x="896" y="222" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">只写自然语言目标，不先猜文件。</text>
    <text x="896" y="248" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#1769E0">no selected_file_refs</text>

    <rect x="872" y="288" width="356" height="152" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/>
    <circle cx="902" cy="322" r="18" fill="#1769E0"/>
    <text x="902" y="329" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
    <text x="932" y="329" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">服务端事实</text>
    <text x="896" y="370" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">冻结完整 allowlisted 索引；</text>
    <text x="896" y="398" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">Planner 只看安全元数据，提出本轮证据。</text>
    <text x="896" y="424" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#1769E0">scope_mode=whole_workspace</text>

    <rect x="872" y="456" width="356" height="132" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
    <circle cx="902" cy="490" r="18" fill="#2E7D32"/>
    <text x="902" y="497" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
    <text x="932" y="497" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">前台反馈</text>
    <text x="896" y="538" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">展示资料依据、模型采用、剩余预算</text>
    <text x="896" y="566" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">以及实时有序 Trace。</text>

    <rect x="872" y="604" width="356" height="64" rx="6" fill="#EDF1F4"/>
    <text x="896" y="631" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#B54708">边界</text>
    <text x="896" y="655" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14" fill="#5A6B7C">自主选资料不等于穷举正确，仍需复核。</text>

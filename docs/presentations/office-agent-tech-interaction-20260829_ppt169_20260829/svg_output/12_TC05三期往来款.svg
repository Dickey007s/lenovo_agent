    <rect x="612" y="180" width="260" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2"/>
    <use data-icon="tabler-outline/file-spreadsheet" x="632" y="201" width="28" height="28" fill="#1769E0" stroke-width="2"/><text x="674" y="225" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#132A3A">2026 期初明细</text>
    <path d="M892 217H1188" stroke="#1769E0" stroke-width="4"/><path d="M1188 217L1168 205V229Z" fill="#1769E0"/>
    <text x="1040" y="202" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1769E0">按不同目的生成三份成果</text>
  </g>
  <g id="artifacts">
    <rect x="52" y="304" width="360" height="232" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/>
    <use data-icon="tabler-outline/file-spreadsheet" x="76" y="328" width="32" height="32" fill="#1769E0" stroke-width="2"/>
    <text x="124" y="354" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#132A3A">未付统计.csv</text>
    <text x="76" y="400" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">只看最新 2026 期</text>
    <text x="76" y="432" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">提取正数贷方期末余额</text>
    <text x="76" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="46" font-weight="700" fill="#1769E0">31</text>
    <text x="140" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">条 · 当前固定来源</text>

    <rect x="436" y="304" width="360" height="232" rx="6" fill="#FFFFFF" stroke="#1769E0" stroke-width="2"/>
    <use data-icon="tabler-outline/file-spreadsheet" x="460" y="328" width="32" height="32" fill="#1769E0" stroke-width="2"/>
    <text x="508" y="354" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#132A3A">未收统计.csv</text>
    <text x="460" y="400" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">只看最新 2026 期</text>
    <text x="460" y="432" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">提取正数借方期末余额</text>
    <text x="460" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="46" font-weight="700" fill="#1769E0">2</text>
    <text x="504" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">条 · 当前固定来源</text>

    <rect x="820" y="304" width="408" height="232" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <use data-icon="tabler-outline/file-text" x="844" y="328" width="32" height="32" fill="#D97706" stroke-width="2"/>
    <text x="892" y="354" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#132A3A">跨期核对说明.md</text>
    <text x="844" y="400" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">这份文件才比较三个期间</text>
    <text x="844" y="432" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">同一科目 + 客商的借方余额是否连续不变</text>
    <text x="844" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="46" font-weight="700" fill="#D97706">0</text>
    <text x="888" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">条风险候选 · 仍需财务复核</text>
  </g>
  <g id="frontstage-impact">
    <rect x="52" y="570" width="1176" height="70" rx="6" fill="#EDF1F4"/>
    <text x="76" y="600" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI Semibold&quot;, Arial, sans-serif" font-size="24" font-weight="700" fill="#132A3A">前台必须先解释“每份成果代表什么”</text>
    <text x="76" y="628" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="17" fill="#5A6B7C">统计完成不等于僵尸账款定论；系统未付款、未核销、未记账，也不替代会计政策判断。</text>
  </g>
  <g id="footer">
    <text x="52" y="690" font-family="&quot;Microsoft YaHei&quot;, &quot;Segoe UI&quot;, Arial, sans-serif" font-size="14" fill="#7C8A98">当前系统实测；交互依据：Microsoft HAI Guidelines · W3C PROV-O</text>
    <text x="1228" y="690" text-anchor="end" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#7C8A98">12 / 17</text>
  </g>

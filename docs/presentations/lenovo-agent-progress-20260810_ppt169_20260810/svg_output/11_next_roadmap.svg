<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F7F9F8"/>
  </g>
  <g id="header">
    <rect x="56" y="42" width="6" height="52" fill="#14865F"/>
    <text x="80" y="82" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#1C2A24">下一轮：四个连续 PR，把剩余假设变成证据</text>
    <text x="1224" y="78" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#74817B">PROPOSED ROADMAP · P11</text>
  </g>
  <g id="takeaway">
    <text x="56" y="136" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#202824">不扩概念面，按恢复风险与用户价值顺序补齐四类证据，再进入真实 Connector 与 Swarm。</text>
    <line x1="56" y1="166" x2="1224" y2="166" stroke="#CDD8D2" stroke-width="1"/>
  </g>
  <g id="roadmap-line">
    <line x1="104" y1="218" x2="104" y2="558" stroke="#CDD8D2" stroke-width="4"/>
  </g>
  <g id="milestone-a">
    <circle cx="104" cy="238" r="24" fill="#14865F"/>
    <use data-icon="chunk-filled/database" x="88" y="222" width="32" height="32" fill="#FFFFFF"/>
    <text x="152" y="230" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#14865F">PR A · PROPOSED</text>
    <text x="152" y="266" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">PostgreSQL 实跑 + API 重启</text>
    <text x="152" y="296" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">对账 Task ID · version · sequence · Artifact head · state hash</text>
  </g>
  <g id="milestone-b">
    <circle cx="104" cy="334" r="24" fill="#1C2A24"/>
    <use data-icon="chunk-filled/arrows-repeat" x="88" y="318" width="32" height="32" fill="#FFFFFF"/>
    <text x="152" y="326" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1C2A24">PR B · PROPOSED</text>
    <text x="152" y="362" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">提交后响应丢失 + Task SSE 恢复</text>
    <text x="152" y="392" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">原 key 找回首次结果 · after 回放 · 序号缺口 · Snapshot 对账</text>
  </g>
  <g id="milestone-c">
    <circle cx="104" cy="430" r="24" fill="#C58B2B"/>
    <use data-icon="chunk-filled/link" x="88" y="414" width="32" height="32" fill="#FFFFFF"/>
    <text x="152" y="422" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#C58B2B">PR C · PROPOSED</text>
    <text x="152" y="458" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">Artifact / Action 版本绑定</text>
    <text x="152" y="488" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">旧审批与 Permit 失效 · 人工接管创建新 ArtifactVersion</text>
  </g>
  <g id="milestone-d">
    <circle cx="104" cy="526" r="24" fill="#B34B3E"/>
    <use data-icon="chunk-filled/users" x="88" y="510" width="32" height="32" fill="#FFFFFF"/>
    <text x="152" y="518" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#B34B3E">PR D · PROPOSED</text>
    <text x="152" y="554" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">H-001 → H-004 目标用户研究</text>
    <text x="152" y="584" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">记录场景 · 样本 · 行为 · 结果 · 局限，不把功能正确性当体验收益</text>
  </g>
  <g id="acceptance-gate">
    <line x1="760" y1="214" x2="760" y2="586" stroke="#14865F" stroke-width="6"/>
    <text x="804" y="250" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#1C2A24">每个 PR 的同一完成门</text>
    <use data-icon="chunk-filled/shield-check" x="804" y="290" width="40" height="40" fill="#14865F"/>
    <text x="864" y="318" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" fill="#202824">场景与来源已登记</text>
    <text x="864" y="348" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">精确引用、支持判断、局限与 Owner</text>
    <use data-icon="chunk-filled/link" x="804" y="380" width="40" height="40" fill="#1C2A24"/>
    <text x="864" y="408" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" fill="#202824">服务端事实与前台状态成对</text>
    <text x="864" y="438" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">Snapshot / Event / 交互 / 默认隐藏</text>
    <use data-icon="chunk-filled/circle-checkmark" x="804" y="470" width="40" height="40" fill="#C58B2B"/>
    <text x="864" y="498" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" fill="#202824">运行证据与边界同屏</text>
    <text x="864" y="528" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">通过什么、未测什么、禁止外推什么</text>
    <text x="804" y="580" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#C58B2B">STATUS: PROPOSED / DRAFT</text>
  </g>
  <g id="closing-rule">
    <rect x="56" y="614" width="1168" height="48" fill="#1C2A24"/>
    <use data-icon="chunk-filled/target-arrow" x="76" y="622" width="32" height="32" fill="#FFFFFF"/>
    <text x="124" y="646" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">完成这四类证据后，再推进真实 Connector 与 Adaptive Swarm 的实现与验证。</text>
  </g>
  <g id="footer">
    <text x="56" y="688" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#74817B">Source: DEMO1-PR4 §5 · SCENARIO-001 §5/§7 · DR-0002 §6</text>
    <text x="1224" y="688" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#14865F">11 / 11</text>
  </g>
</svg>

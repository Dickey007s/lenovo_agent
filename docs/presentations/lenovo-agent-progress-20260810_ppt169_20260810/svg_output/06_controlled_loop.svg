<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F7F9F8"/>
  </g>
  <g id="header">
    <rect x="56" y="42" width="6" height="52" fill="#14865F"/>
    <text x="80" y="82" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#1C2A24">PR #6：冲突、控制与 Commit 都有服务端事实</text>
    <text x="1224" y="78" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#74817B">CONTROLLED LOOP · P06</text>
  </g>
  <g id="takeaway">
    <text x="56" y="136" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#202824">固定 Fixture 已能原子地产生有序 Trace、工件版本、验证、局部冲突与最终 Commit。</text>
    <line x1="56" y1="166" x2="1224" y2="166" stroke="#CDD8D2" stroke-width="1"/>
  </g>
  <g id="loop-flow">
    <g id="step-observe">
      <rect x="56" y="210" width="184" height="120" fill="#FFFFFF" stroke="#CDD8D2" stroke-width="1"/>
      <text x="76" y="242" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#14865F">01</text>
      <text x="76" y="282" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">Observe</text>
      <text x="76" y="314" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">读取四个 Fixture 引用</text>
    </g>
    <polygon points="248,260 272,260 272,248 294,270 272,292 272,280 248,280" fill="#14865F"/>
    <g id="step-plan">
      <rect x="302" y="210" width="184" height="120" fill="#EEF3F0" stroke="#CDD8D2" stroke-width="1"/>
      <text x="322" y="242" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#14865F">02</text>
      <text x="322" y="282" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">Plan</text>
      <text x="322" y="314" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">三分支与预算检查</text>
    </g>
    <polygon points="494,260 518,260 518,248 540,270 518,292 518,280 494,280" fill="#14865F"/>
    <g id="step-act">
      <rect x="548" y="210" width="184" height="120" fill="#FFFFFF" stroke="#CDD8D2" stroke-width="1"/>
      <text x="568" y="242" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#14865F">03</text>
      <text x="568" y="282" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">Act</text>
      <text x="568" y="314" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">追加 ArtifactVersion</text>
    </g>
    <polygon points="740,260 764,260 764,248 786,270 764,292 764,280 740,280" fill="#C58B2B"/>
    <g id="step-verify">
      <rect x="794" y="210" width="184" height="120" fill="#EEF3F0" stroke="#C58B2B" stroke-width="2"/>
      <text x="814" y="242" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#C58B2B">04</text>
      <text x="814" y="282" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">Verify</text>
      <text x="814" y="314" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">验证报告 + 冲突门</text>
    </g>
    <polygon points="986,260 1010,260 1010,248 1032,270 1010,292 1010,280 986,280" fill="#14865F"/>
    <g id="step-commit">
      <rect x="1040" y="210" width="184" height="120" fill="#14865F" stroke="#14865F" stroke-width="1"/>
      <text x="1060" y="242" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#FFFFFF">05</text>
      <text x="1060" y="282" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Commit</text>
      <text x="1060" y="314" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#FFFFFF">引用完整 · state hash</text>
    </g>
  </g>
  <g id="conflict-gate">
    <line x1="886" y1="330" x2="886" y2="374" stroke="#C58B2B" stroke-width="3"/>
    <polygon points="876,374 896,374 886,390" fill="#C58B2B"/>
    <rect x="426" y="394" width="798" height="110" fill="#FFFFFF" stroke="#C58B2B" stroke-width="2"/>
    <rect x="426" y="394" width="10" height="110" fill="#C58B2B"/>
    <use data-icon="chunk-filled/triangle-exclamation" x="458" y="426" width="44" height="44" fill="#C58B2B"/>
    <text x="524" y="430" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">经营分析：收入事实冲突</text>
    <text x="524" y="472" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#202824">CRM 2,400 万  ↔  Forecast 2,680 万</text>
    <text x="1200" y="436" text-anchor="end" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#52605A">只阻塞目标分支</text>
    <text x="1200" y="468" text-anchor="end" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#C58B2B">最后一个冲突关闭后才 Commit</text>
    <line x1="974" y1="448" x2="1008" y2="448" stroke="#C58B2B" stroke-width="2"/>
  </g>
  <g id="branch-status">
    <rect x="56" y="394" width="342" height="110" fill="#EEF3F0" stroke="#CDD8D2" stroke-width="1"/>
    <use data-icon="chunk-filled/circle-checkmark" x="80" y="426" width="40" height="40" fill="#14865F"/>
    <text x="140" y="432" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#202824">其他分支保持独立</text>
    <text x="140" y="466" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#52605A">风险页 / 客户回复</text>
    <text x="140" y="490" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#52605A">可形成已验证工件</text>
  </g>
  <g id="control-and-proof">
    <line x1="56" y1="540" x2="1224" y2="540" stroke="#CDD8D2" stroke-width="1"/>
    <use data-icon="chunk-filled/git-branch" x="56" y="566" width="40" height="40" fill="#1C2A24"/>
    <text x="116" y="592" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#202824">Pause / Resume / Take over / Return control 已有状态事实</text>
    <text x="116" y="624" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#C58B2B">Steer：只说“已记录，等待后续循环应用”</text>
    <text x="1224" y="592" text-anchor="end" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#14865F">15 targeted · 56 full Python</text>
    <text x="1224" y="624" text-anchor="end" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#C58B2B">一次原子 mutation，不是后台持续调度</text>
  </g>
  <g id="footer">
    <text x="56" y="688" font-family="'Microsoft YaHei UI', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#74817B">Source: DEMO1-PR3-RUNTIME-EVIDENCE §1/§3-5 · SCENARIO-001 §4-5</text>
    <text x="1224" y="688" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#14865F">06 / 11</text>
  </g>
</svg>

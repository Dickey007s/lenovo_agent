  <g id="footer"><text x="56" y="670" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#8291A3">Fixed path Limited Verified；通用跨 Worker 一致性与分布式存储仍是 Draft</text><text x="1224" y="670" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P10</text></g>

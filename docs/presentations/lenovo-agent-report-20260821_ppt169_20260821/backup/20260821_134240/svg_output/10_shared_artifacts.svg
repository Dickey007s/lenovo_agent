<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><text x="56" y="74" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">多 Agent 不靠“互相转述”，而靠共享工件版本收敛</text><text x="56" y="112" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">每个 Worker 交付带来源、版本、digest 与验证状态的 Artifact</text></g>
  <g id="receipt-image">
    <rect x="56" y="150" width="684" height="475" fill="#FFFFFF" stroke="#CAD6E3"/>
    <image x="68" y="162" width="660" height="451" xlink:href="../images/dr-0015-demo2-controlled-execution-1440-completed-receipt.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="composition">

    <rect x="780" y="316" width="136" height="168" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="934" y="316" width="136" height="168" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="1088" y="316" width="136" height="168" fill="#FFFFFF" stroke="#CAD6E3"/>
    <text x="796" y="350" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#172230">收入事实</text><text x="796" y="382" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#526579">财务关账</text><text x="796" y="408" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#526579">销售预测</text><text x="796" y="452" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#0B3A70">v2 · passed</text>
    <text x="950" y="350" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#172230">项目风险</text><text x="950" y="382" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#526579">周报来源</text><text x="950" y="408" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#526579">影响范围</text><text x="950" y="452" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#16845B">v2 · passed</text>
    <text x="1104" y="350" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#172230">客户回复</text><text x="1104" y="382" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#526579">邮件要求</text><text x="1104" y="408" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#526579">草稿未发送</text><text x="1104" y="452" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#16845B">v2 · passed</text>
    <rect x="780" y="506" width="444" height="119" fill="#EAF0F7"/>

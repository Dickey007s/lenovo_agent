<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><text x="48" y="70" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">下一步要证明：为什么这样组织工作更值得用</text><text x="48" y="108" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">同一任务、同一来源、同一模型条件下，只改变路由策略</text></g>
  <g id="task-anchor"><rect x="48" y="144" width="1184" height="72" fill="#172230"/><text x="72" y="175" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#EAF0F7">冻结任务</text><text x="72" y="202" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">客户 A：从允许来源生成可验证经营汇报包，并处理收入口径冲突</text></g>
  <g id="route-headers"><rect x="48" y="236" width="208" height="58" fill="#EAF0F7"/><rect x="256" y="236" width="244" height="58" fill="#526579"/><rect x="500" y="236" width="244" height="58" fill="#526579"/><rect x="744" y="236" width="244" height="58" fill="#526579"/><rect x="988" y="236" width="244" height="58" fill="#0B3A70"/><text x="152" y="272" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#526579">对照维度</text><text x="378" y="272" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Tool Call</text><text x="622" y="272" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Single Agent</text><text x="866" y="272" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Fixed Workflow</text><text x="1110" y="272" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Adaptive Swarm</text></g>
  <g id="route-body">
    <rect x="48" y="294" width="1184" height="80" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="48" y="374" width="1184" height="80" fill="#EAF0F7" stroke="#CAD6E3"/><rect x="48" y="454" width="1184" height="80" fill="#FFFFFF" stroke="#CAD6E3"/>
    <line x1="256" y1="294" x2="256" y2="534" stroke="#CAD6E3"/><line x1="500" y1="294" x2="500" y2="534" stroke="#CAD6E3"/><line x1="744" y1="294" x2="744" y2="534" stroke="#CAD6E3"/><line x1="988" y1="294" x2="988" y2="534" stroke="#0B3A70" stroke-width="2"/>
    <text x="72" y="342" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#172230">工作组织</text><text x="72" y="422" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#172230">冲突处理</text><text x="72" y="502" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#172230">用户控制</text>
    <text x="280" y="332" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">按命令调用工具</text><text x="280" y="356" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#8291A3">无长期状态</text>
    <text x="524" y="332" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">一个 Agent 串行完成</text><text x="524" y="356" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#8291A3">上下文集中</text>
    <text x="768" y="332" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">预定义阶段与分支</text><text x="768" y="356" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#8291A3">组织稳定</text>
    <text x="1012" y="332" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B3A70">按事实动态增派</text><text x="1012" y="356" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#0B3A70">共享工件收敛</text>
    <text x="280" y="422" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">返回错误</text><text x="524" y="422" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">模型自主修正</text><text x="768" y="422" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">固定验证节点</text><text x="1012" y="422" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B3A70">局部重排与验证 Worker</text>
    <text x="280" y="502" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">命令级确认</text><text x="524" y="502" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">会话级介入</text><text x="768" y="502" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">阶段 Gate</text><text x="1012" y="502" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B3A70">原因、影响与回执</text>
  </g>
  <g id="metrics">
    <text x="48" y="576" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B3A70">统一评估指标</text>
    <rect x="48" y="596" width="178" height="50" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="240" y="596" width="178" height="50" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="432" y="596" width="178" height="50" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="624" y="596" width="178" height="50" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="816" y="596" width="178" height="50" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="1008" y="596" width="224" height="50" fill="#FFFFFF" stroke="#CAD6E3"/>
    <text x="137" y="627" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#172230">工件完整度</text><text x="329" y="627" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#172230">冲突恢复正确率</text><text x="521" y="627" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#172230">收敛时间</text><text x="713" y="627" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#172230">模型调用数</text><text x="905" y="627" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#172230">人工确认负担</text><text x="1120" y="627" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#172230">失败 / 未知结果率</text>
  </g>
  <g id="footer"><text x="48" y="680" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#D71920">Draft / planned study：尚无对照结果；保留负面结果，分离模型能力与编排效果</text><text x="1232" y="680" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P15</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><text x="48" y="70" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">Demo 1：长任务不是一次性回答</text><text x="48" y="108" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">同一个 Task 持续推进；局部来源冲突不会把整项工作推倒重来</text></g>
  <g id="phase-strip">
    <line x1="86" y1="164" x2="1170" y2="164" stroke="#CAD6E3" stroke-width="4"/>
    <circle cx="90" cy="164" r="24" fill="#0B3A70"/><circle cx="290" cy="164" r="24" fill="#0B3A70"/><circle cx="490" cy="164" r="24" fill="#0B3A70"/><circle cx="690" cy="164" r="24" fill="#0B3A70"/><circle cx="890" cy="164" r="24" fill="#D71920"/><circle cx="1090" cy="164" r="24" fill="#16845B"/>
    <text x="90" y="171" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#FFFFFF">v1</text><text x="290" y="171" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#FFFFFF">v2</text><text x="490" y="171" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#FFFFFF">v3</text><text x="690" y="171" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#FFFFFF">v4</text><text x="890" y="171" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#FFFFFF">v6</text><text x="1090" y="171" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="16" font-weight="700" fill="#FFFFFF">v7</text>
    <text x="90" y="206" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#172230">任务合同</text><text x="290" y="206" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#172230">读取资料</text><text x="490" y="206" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#172230">拆分任务</text><text x="690" y="206" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#172230">生成材料</text><text x="890" y="206" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#D71920">等待决定</text><text x="1090" y="206" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#16845B">最终提交</text>
  </g>
  <g id="screenshot">
    <rect x="48" y="240" width="690" height="388" fill="#FFFFFF" stroke="#CAD6E3" stroke-width="1.5"/>
    <image x="60" y="252" width="666" height="364" xlink:href="../images/image41.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="conflict-callout">
    <rect x="766" y="240" width="466" height="178" fill="#FFFFFF" stroke="#D71920" stroke-width="2"/>
    <rect x="766" y="240" width="10" height="178" fill="#D71920"/>
    <use data-icon="tabler-outline/alert-triangle" x="794" y="264" width="30" height="30" stroke="#D71920" stroke-width="2" fill="none"/>
    <text x="840" y="286" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">客户 A 收入口径冲突</text>
    <text x="794" y="326" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">财务关账文件：已实现收入 2400 万元</text>
    <text x="794" y="356" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">销售预测文件：Q3 预测收入 2680 万元</text>
    <text x="794" y="392" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#D71920">字段语义不同，Agent 不得自动选择。</text>
  </g>
  <g id="branch-effects">
    <rect x="766" y="438" width="466" height="190" fill="#EAF0F7"/>
    <text x="794" y="472" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B3A70">局部暂停，整体继续</text>
    <line x1="806" y1="506" x2="806" y2="598" stroke="#CAD6E3" stroke-width="3"/>
    <circle cx="806" cy="518" r="8" fill="#D71920"/><circle cx="806" cy="558" r="8" fill="#16845B"/><circle cx="806" cy="598" r="8" fill="#16845B"/>
    <text x="830" y="524" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">经营分析分支等待人工口径</text>
    <text x="830" y="564" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">风险页保持已验证版本</text>
    <text x="830" y="604" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">客户回复草稿保留，不发送</text>
  </g>
  <g id="footer"><text x="48" y="674" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#8291A3">Verified：固定客户 A、项目生成仿真文件、文件校验与渐进阶段；通用持久 Runtime 仍待扩展</text><text x="1232" y="674" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P06</text></g>
</svg>

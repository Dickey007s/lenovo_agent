<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><text x="48" y="72" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">三个 Demo，是同一个 Runtime 的三种用户视角</text><text x="48" y="110" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">时间连续性、复杂任务组织、业务副作用控制，共用同一套来源与版本语言</text></g>
  <g id="demo-bands">
    <rect x="48" y="150" width="1184" height="126" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="48" y="150" width="190" height="126" fill="#0B3A70"/>
    <text x="72" y="188" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#EAF0F7">DEMO 1</text><text x="72" y="226" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">持续任务</text><text x="72" y="254" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#EAF0F7">时间连续性</text>
    <text x="274" y="188" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">用户看见</text><text x="274" y="224" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">阶段、分支、冲突、当前工件</text><text x="682" y="188" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">服务端事实</text><text x="682" y="224" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#0B3A70">Task / Branch / Artifact</text><text x="1010" y="206" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#16845B">持续收敛</text>
    <rect x="48" y="294" width="1184" height="126" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="48" y="294" width="190" height="126" fill="#172230"/>
    <text x="72" y="332" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#EAF0F7">DEMO 2</text><text x="72" y="370" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">协作执行</text><text x="72" y="398" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#EAF0F7">复杂任务组织</text>
    <text x="274" y="332" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">用户看见</text><text x="274" y="368" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">路线、Worker、动态重排、共享包</text><text x="682" y="332" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">服务端事实</text><text x="682" y="368" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#0B3A70">Admission / Worker / Snapshot</text><text x="1010" y="350" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#16845B">组织改变</text>
    <rect x="48" y="438" width="1184" height="126" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="48" y="438" width="190" height="126" fill="#D71920"/>
    <text x="72" y="476" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#FFFFFF">DEMO 3</text><text x="72" y="514" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">受控动作</text><text x="72" y="542" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#FFFFFF">业务副作用</text>
    <text x="274" y="476" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">用户看见</text><text x="274" y="512" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">影响预演、审批、许可、回执</text><text x="682" y="476" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">服务端事实</text><text x="682" y="512" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#0B3A70">ActionSpec / Permit / Receipt</text><text x="1010" y="494" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#16845B">影响可控</text>
  </g>
  <g id="foundation">
    <rect x="48" y="592" width="1184" height="66" fill="#EAF0F7"/>
    <text x="72" y="618" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#0B3A70">共同底座</text><text x="188" y="632" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#172230">Contract · State · Context · Execution · Capability · Evidence · Policy · Trace</text>
  </g>
  <g id="shared-protocol"><line x1="128" y1="682" x2="1128" y2="682" stroke="#D71920" stroke-width="3"/><text x="628" y="674" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#D71920">来源 · 版本 · 事件 · 用户控制</text></g>
  <g id="footer"><text x="1232" y="706" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P13</text></g>
</svg>

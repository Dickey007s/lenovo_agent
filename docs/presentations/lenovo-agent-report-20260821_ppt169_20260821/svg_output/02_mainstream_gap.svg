<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect width="1280" height="720" fill="#F7F9FC"/>
    <rect x="48" y="42" width="8" height="50" fill="#D71920"/>
    <text x="76" y="78" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">主流 Agent 已经很能执行，我们还要补什么？</text>
    <text x="76" y="116" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">官方能力对照 · 不做性能优劣排名 · 差异落到用户看见的业务对象</text>
  </g>
  <g id="comparison-header">
    <rect x="48" y="150" width="206" height="66" fill="#EAF0F7"/>
    <text x="64" y="191" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#526579">对比维度</text>
    <rect x="254" y="150" width="228" height="66" fill="#172230"/>
    <rect x="482" y="150" width="228" height="66" fill="#172230"/>
    <rect x="710" y="150" width="228" height="66" fill="#172230"/>
    <rect x="938" y="150" width="294" height="66" fill="#0B3A70"/>
    <text x="368" y="191" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#F7F9FC">OpenClaw</text>
    <text x="596" y="191" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#F7F9FC">Codex</text>
    <text x="824" y="191" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#F7F9FC">Claude Code</text>
    <text x="1085" y="182" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Office Agent</text>
    <text x="1085" y="204" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#EAF0F7">本项目关注层</text>
  </g>
  <g id="comparison-rows">
    <rect x="48" y="216" width="1184" height="78" fill="#FFFFFF" stroke="#CAD6E3"/>
    <rect x="48" y="294" width="1184" height="78" fill="#EAF0F7" stroke="#CAD6E3"/>
    <rect x="48" y="372" width="1184" height="78" fill="#FFFFFF" stroke="#CAD6E3"/>
    <rect x="48" y="450" width="1184" height="78" fill="#EAF0F7" stroke="#CAD6E3"/>
    <rect x="938" y="216" width="294" height="312" fill="#0B3A70" fill-opacity="0.06" stroke="#0B3A70" stroke-width="2"/>
    <line x1="254" y1="216" x2="254" y2="528" stroke="#CAD6E3"/>
    <line x1="482" y1="216" x2="482" y2="528" stroke="#CAD6E3"/>
    <line x1="710" y1="216" x2="710" y2="528" stroke="#CAD6E3"/>
    <line x1="938" y1="216" x2="938" y2="528" stroke="#0B3A70" stroke-width="2"/>
    <text x="64" y="264" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#172230">核心组织对象</text>
    <text x="64" y="342" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#172230">执行与并行</text>
    <text x="64" y="420" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#172230">权限与恢复</text>
    <text x="64" y="498" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#172230">用户主要看到</text>
    <text x="274" y="250" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Gateway / Session</text><text x="274" y="274" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Agent Routing</text>
    <text x="502" y="250" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Thread / Worktree</text><text x="502" y="274" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Coding Agent</text>
    <text x="730" y="250" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Session / Subagent</text><text x="730" y="274" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Tool Use</text>
    <text x="958" y="250" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B3A70">Task / Branch / Artifact</text><text x="958" y="274" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#0B3A70">ControlEvent / Receipt</text>
    <text x="274" y="342" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">多 Agent 路由与自动化</text>
    <text x="502" y="342" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">并行任务与后台自动化</text>
    <text x="730" y="342" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">子 Agent 与 Hooks</text>
    <text x="958" y="330" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B3A70">按业务复杂度组织工作</text><text x="958" y="356" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#0B3A70">分支隔离、共享工件、动态重排</text>
    <text x="274" y="420" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Exec approval / session</text>
    <text x="502" y="420" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Sandbox / review / resume</text>
    <text x="730" y="408" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">Permissions / sandbox</text>
    <text x="730" y="434" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">hooks / resume</text>
    <text x="958" y="408" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B3A70">风险、证据、审批、Permit</text><text x="958" y="434" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#0B3A70">动作影响预演与执行回执</text>
    <text x="274" y="498" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Session / route / command</text>
    <text x="502" y="498" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Thread / diff / review</text>
    <text x="730" y="498" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Tool / permission / output</text>
    <text x="958" y="486" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B3A70">哪份材料、哪个冲突</text><text x="958" y="512" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#0B3A70">确认后会改变什么</text>
  </g>
  <g id="takeaway">
    <rect x="48" y="560" width="1184" height="88" fill="#172230"/>
    <text x="72" y="598" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#D71920">关键差异</text>
    <text x="72" y="630" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">不是再造一个执行框架，而是把企业业务事实变成用户可见、服务端可证明的协议。</text>
  </g>
  <g id="footer"><text x="48" y="690" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#8291A3">来源：OpenClaw、Codex、Claude Code 官方材料与源码审计；无正面对照基准</text><text x="1232" y="690" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P02</text></g>
</svg>

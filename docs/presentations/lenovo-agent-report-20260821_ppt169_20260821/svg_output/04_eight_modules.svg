<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><text x="48" y="72" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">八个最小模块，把运行变成可持续、可验证、可控制</text><text x="48" y="112" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">复杂能力不是默认常驻，而是按任务复杂度和风险按需装配</text></g>
  <g id="maturity-ribbon">
    <rect x="48" y="146" width="378" height="52" fill="#16845B"/><rect x="426" y="146" width="402" height="52" fill="#0B3A70"/><rect x="828" y="146" width="404" height="52" fill="#EAF0F7"/>
    <text x="237" y="179" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">固定纵切 · Limited Verified</text><text x="627" y="179" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">协议与治理 · 已实现</text><text x="1030" y="179" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#526579">通用化与生产化 · Draft</text>
  </g>
  <g id="module-grid">
    <rect x="48" y="218" width="282" height="142" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="348" y="218" width="282" height="142" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="648" y="218" width="282" height="142" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="948" y="218" width="284" height="142" fill="#FFFFFF" stroke="#CAD6E3"/>
    <rect x="48" y="380" width="282" height="142" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="348" y="380" width="282" height="142" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="648" y="380" width="282" height="142" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="948" y="380" width="284" height="142" fill="#FFFFFF" stroke="#CAD6E3"/>
    <rect x="48" y="218" width="8" height="142" fill="#16845B"/><rect x="348" y="218" width="8" height="142" fill="#16845B"/><rect x="648" y="218" width="8" height="142" fill="#0B3A70"/><rect x="948" y="218" width="8" height="142" fill="#0B3A70"/><rect x="48" y="380" width="8" height="142" fill="#0B3A70"/><rect x="348" y="380" width="8" height="142" fill="#0B3A70"/><rect x="648" y="380" width="8" height="142" fill="#0B3A70"/><rect x="948" y="380" width="8" height="142" fill="#D71920"/>
    <use data-icon="tabler-outline/layout-dashboard" x="76" y="242" width="32" height="32" stroke="#16845B" stroke-width="2" fill="none"/><text x="124" y="266" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">Task Contract</text><text x="76" y="306" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">目标、预算、截止时间</text><text x="76" y="334" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#16845B">固定路径已验证</text>
    <use data-icon="tabler-outline/refresh" x="376" y="242" width="32" height="32" stroke="#16845B" stroke-width="2" fill="none"/><text x="424" y="266" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">Durable State</text><text x="376" y="306" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">版本、事件、恢复</text><text x="376" y="334" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#16845B">Task 跨 API 证据</text>
    <use data-icon="tabler-outline/file-search" x="676" y="242" width="32" height="32" stroke="#0B3A70" stroke-width="2" fill="none"/><text x="724" y="266" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">Context State</text><text x="676" y="306" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">来源、活动视图、草稿</text><text x="676" y="334" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#0B3A70">服务端拥有事实</text>
    <use data-icon="tabler-outline/bolt" x="976" y="242" width="32" height="32" stroke="#0B3A70" stroke-width="2" fill="none"/><text x="1024" y="266" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">Execution Loop</text><text x="976" y="306" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">Observe 到 Commit</text><text x="976" y="334" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#0B3A70">渐进阶段可见</text>
    <use data-icon="tabler-outline/users-group" x="76" y="404" width="32" height="32" stroke="#0B3A70" stroke-width="2" fill="none"/><text x="124" y="428" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">Capability Runtime</text><text x="76" y="468" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">单 Agent、固定流、Swarm</text><text x="76" y="496" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#0B3A70">按需路由</text>
    <use data-icon="tabler-outline/file-check" x="376" y="404" width="32" height="32" stroke="#0B3A70" stroke-width="2" fill="none"/><text x="424" y="428" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">Evidence Verifier</text><text x="376" y="468" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">来源、冲突、质量检查</text><text x="376" y="496" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#0B3A70">不让模型自证</text>
    <use data-icon="tabler-outline/shield-check" x="676" y="404" width="32" height="32" stroke="#0B3A70" stroke-width="2" fill="none"/><text x="724" y="428" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">Control Policy</text><text x="676" y="468" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">风险、审批、Permit</text><text x="676" y="496" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#0B3A70">副作用前置控制</text>
    <use data-icon="tabler-outline/server-2" x="976" y="404" width="32" height="32" stroke="#D71920" stroke-width="2" fill="none"/><text x="1024" y="428" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#172230">Trace / Checkpoint</text><text x="976" y="468" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" fill="#526579">可审计序列与状态指纹</text><text x="976" y="496" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#D71920">跨实例仍待验证</text>
  </g>
  <g id="projection"><rect x="48" y="558" width="1184" height="84" fill="#172230"/><text x="72" y="592" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#16845B">前台原则</text><text x="72" y="624" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">用户只看可读业务状态；每个状态都回指 Snapshot、Event、Artifact 或 Receipt。</text></g>
  <g id="footer"><text x="48" y="690" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#8291A3">成熟度随证据范围标记，不能从固定纵切外推通用能力</text><text x="1232" y="690" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P04</text></g>
</svg>

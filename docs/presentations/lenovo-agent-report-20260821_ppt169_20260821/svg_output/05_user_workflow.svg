<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><text x="56" y="76" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">用户不是想“调用模型”，而是想把工作推进到可交付</text><text x="56" y="114" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">工作区是主角，Agent 是协作层；每一步都要说清对象、依据和下一步影响</text></g>
  <g id="story">
    <rect x="56" y="150" width="392" height="390" fill="#FFFFFF" stroke="#CAD6E3"/>
    <text x="80" y="188" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#D71920">用户故事</text>
    <text x="80" y="234" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#172230">“整理客户 A 经营汇报，</text>
    <text x="80" y="274" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#172230">给我可确认的下一步。”</text>
    <line x1="80" y1="304" x2="420" y2="304" stroke="#CAD6E3"/>
    <text x="80" y="346" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#0B3A70">今天的代价</text>
    <text x="80" y="382" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">在邮件、CRM、日历、文档间切换</text>
    <text x="80" y="414" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">靠聊天摘要记住来源与版本</text>
    <text x="80" y="446" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">无法预知下一步是否产生副作用</text>
    <rect x="80" y="478" width="330" height="40" fill="#EAF0F7"/>
    <text x="245" y="504" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#0B3A70">真正需要：可交付状态，不是更多对话</text>
  </g>
  <g id="workspace-evidence">
    <rect x="480" y="150" width="744" height="260" fill="#FFFFFF" stroke="#CAD6E3"/>
    <image x="492" y="162" width="352" height="236" xlink:href="../images/image42.png" preserveAspectRatio="xMidYMid meet"/>
    <image x="860" y="162" width="352" height="236" xlink:href="../images/image43.png" preserveAspectRatio="xMidYMid meet"/>
    <line x1="848" y1="170" x2="848" y2="390" stroke="#CAD6E3"/>
  </g>
  <g id="target-flow">
    <text x="480" y="452" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#0B3A70">目标流程</text>
    <line x1="520" y1="508" x2="1160" y2="508" stroke="#CAD6E3" stroke-width="3"/>
    <circle cx="520" cy="508" r="28" fill="#0B3A70"/><circle cx="680" cy="508" r="28" fill="#0B3A70"/><circle cx="840" cy="508" r="28" fill="#D71920"/><circle cx="1000" cy="508" r="28" fill="#0B3A70"/><circle cx="1160" cy="508" r="28" fill="#16845B"/>
    <text x="520" y="516" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#FFFFFF">01</text><text x="680" y="516" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#FFFFFF">02</text><text x="840" y="516" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#FFFFFF">03</text><text x="1000" y="516" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#FFFFFF">04</text><text x="1160" y="516" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#FFFFFF">05</text>
    <text x="520" y="562" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#172230">读取允许来源</text><text x="680" y="562" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#172230">形成工件草稿</text><text x="840" y="562" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#172230">冲突与证据门</text><text x="1000" y="562" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#172230">验证可交付物</text><text x="1160" y="562" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#172230">受控业务动作</text>
    <text x="520" y="588" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#526579">文件和业务系统</text><text x="680" y="588" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#526579">用户仍可编辑</text><text x="840" y="588" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#526579">不替用户猜</text><text x="1000" y="588" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#526579">来源与版本绑定</text><text x="1160" y="588" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#526579">先预演后回执</text>
  </g>
  <g id="rule"><rect x="56" y="620" width="1168" height="52" fill="#172230"/><text x="80" y="653" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">关键交互不变量：Agent 返回期间用户仍能工作，晚到结果不能覆盖新输入。</text></g>
  <g id="footer"><text x="56" y="704" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="14" fill="#8291A3">场景来源：0716-v2 会后反馈与三组固定纵切场景；用户价值仍待形成性测试</text><text x="1224" y="704" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P05</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><text x="48" y="70" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">证据不是装饰：每一个“已完成”都必须带范围</text><text x="48" y="108" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">固定纵切可以运行，不等于通用能力，更不等于用户价值已经成立</text></g>
  <g id="matrix-header"><rect x="48" y="146" width="210" height="62" fill="#172230"/><rect x="258" y="146" width="330" height="62" fill="#172230"/><rect x="588" y="146" width="310" height="62" fill="#172230"/><rect x="898" y="146" width="334" height="62" fill="#D71920"/><text x="153" y="185" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">证据等级</text><text x="423" y="185" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">已经证明</text><text x="743" y="185" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">前台可陈述</text><text x="1065" y="185" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">不能外推</text></g>
  <g id="verified-row"><rect x="48" y="208" width="1184" height="132" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="48" y="208" width="210" height="132" fill="#16845B"/><text x="153" y="258" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Verified</text><text x="153" y="292" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#FFFFFF">固定场景完整证据</text>
    <text x="282" y="246" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#172230">Demo 1 文件冲突路径</text><text x="282" y="278" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#526579">Demo 3 Simulator 动作账本</text><text x="282" y="308" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#526579">协议、截图、自动化与回执一致</text>
    <text x="612" y="246" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">“固定客户 A 路径可运行”</text><text x="612" y="278" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">“外部真实写入未发生”</text>
    <text x="922" y="246" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">生产可靠性</text><text x="922" y="278" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">真实客户价值</text><text x="922" y="308" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">真实 Connector 能力</text>
  </g>
  <g id="limited-row"><rect x="48" y="350" width="1184" height="132" fill="#EAF0F7" stroke="#CAD6E3"/><rect x="48" y="350" width="210" height="132" fill="#0B3A70"/><text x="153" y="400" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Limited Verified</text><text x="153" y="434" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#EAF0F7">受限工程范围</text>
    <text x="282" y="388" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#172230">Demo 2 受控内部执行</text><text x="282" y="420" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#526579">单 API 进程 · memory · 固定客户 A</text><text x="282" y="450" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#526579">4 模型采用 · 15 个有序事件</text>
    <text x="612" y="388" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">“冲突触发了动态重排”</text><text x="612" y="420" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">“4 Worker / 5 Artifact”</text><text x="612" y="450" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">“external side effect = none”</text>
    <text x="922" y="388" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">分布式 Worker</text><text x="922" y="420" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">跨进程恢复</text><text x="922" y="450" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">成本与 SLA 结论</text>
  </g>
  <g id="draft-row"><rect x="48" y="492" width="1184" height="132" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="48" y="492" width="210" height="132" fill="#8291A3"/><text x="153" y="542" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Draft</text><text x="153" y="576" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="15" fill="#FFFFFF">设计主张 / 待实验</text>
    <text x="282" y="530" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#172230">主流差异与交互新颖性</text><text x="282" y="562" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#526579">通用 Swarm、真实 Connector</text><text x="282" y="592" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#526579">成本、质量、效率与用户价值</text>
    <text x="612" y="530" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">“下一步实验计划”</text><text x="612" y="562" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#172230">“需要用户研究验证”</text>
    <text x="922" y="530" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">不得写成已实现</text><text x="922" y="562" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">不得写成竞品做不到</text><text x="922" y="592" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#D71920">不得冒充真实用户研究</text>
  </g>
  <g id="footer"><text x="48" y="666" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="16" fill="#526579">证据等级与边界跟随每个对外结论，而不是只放在附录。</text><text x="1232" y="700" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P14</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9FC"/><text x="48" y="70" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="#172230">前端展示什么，后端就必须能证明什么</text><text x="48" y="108" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" fill="#526579">Task / Branch / Artifact / ControlEvent 是产品设计与 Runtime 的共同词汇</text></g>
  <g id="headers"><rect x="48" y="146" width="350" height="54" fill="#0B3A70"/><rect x="444" y="146" width="360" height="54" fill="#172230"/><rect x="850" y="146" width="382" height="54" fill="#16845B"/><text x="223" y="181" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">用户界面</text><text x="624" y="181" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">协议映射</text><text x="1041" y="181" text-anchor="middle" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">服务端事实</text></g>
  <g id="mapping-rows">
    <rect x="48" y="214" width="350" height="72" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="444" y="214" width="360" height="72" fill="#EAF0F7" stroke="#CAD6E3"/><rect x="850" y="214" width="382" height="72" fill="#FFFFFF" stroke="#CAD6E3"/>
    <rect x="48" y="298" width="350" height="72" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="444" y="298" width="360" height="72" fill="#EAF0F7" stroke="#CAD6E3"/><rect x="850" y="298" width="382" height="72" fill="#FFFFFF" stroke="#CAD6E3"/>
    <rect x="48" y="382" width="350" height="72" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="444" y="382" width="360" height="72" fill="#EAF0F7" stroke="#CAD6E3"/><rect x="850" y="382" width="382" height="72" fill="#FFFFFF" stroke="#CAD6E3"/>
    <rect x="48" y="466" width="350" height="72" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="444" y="466" width="360" height="72" fill="#EAF0F7" stroke="#CAD6E3"/><rect x="850" y="466" width="382" height="72" fill="#FFFFFF" stroke="#CAD6E3"/>
    <rect x="48" y="550" width="350" height="72" fill="#FFFFFF" stroke="#CAD6E3"/><rect x="444" y="550" width="360" height="72" fill="#EAF0F7" stroke="#CAD6E3"/><rect x="850" y="550" width="382" height="72" fill="#FFFFFF" stroke="#CAD6E3"/>
    <text x="72" y="258" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#172230">任务栏：状态、阶段、版本</text><text x="470" y="258" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#0B3A70">GET + SSE + version</text><text x="876" y="258" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#172230">TaskSnapshot</text>
    <text x="72" y="342" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#172230">分支状态与冲突卡</text><text x="470" y="342" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#0B3A70">branch_id + conflict_id</text><text x="876" y="342" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#172230">Branch / ConflictRecord</text>
    <text x="72" y="426" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#172230">共享工件与验证</text><text x="470" y="426" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#0B3A70">version + digest + source</text><text x="876" y="426" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#172230">ArtifactVersion / Report</text>
    <text x="72" y="510" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#172230">待确认动作与影响预演</text><text x="470" y="510" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#0B3A70">expected_version + idempotency</text><text x="876" y="510" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#172230">ControlEvent / Approval</text>
    <text x="72" y="594" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#172230">结果横幅与恢复入口</text><text x="470" y="594" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#0B3A70">message_id + receipt status</text><text x="876" y="594" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#172230">ExecutionReceipt</text>
    <line x1="398" y1="250" x2="444" y2="250" stroke="#0B3A70" stroke-width="2"/><line x1="804" y1="250" x2="850" y2="250" stroke="#16845B" stroke-width="2"/><line x1="398" y1="334" x2="444" y2="334" stroke="#0B3A70" stroke-width="2"/><line x1="804" y1="334" x2="850" y2="334" stroke="#16845B" stroke-width="2"/><line x1="398" y1="418" x2="444" y2="418" stroke="#0B3A70" stroke-width="2"/><line x1="804" y1="418" x2="850" y2="418" stroke="#16845B" stroke-width="2"/><line x1="398" y1="502" x2="444" y2="502" stroke="#0B3A70" stroke-width="2"/><line x1="804" y1="502" x2="850" y2="502" stroke="#16845B" stroke-width="2"/><line x1="398" y1="586" x2="444" y2="586" stroke="#0B3A70" stroke-width="2"/><line x1="804" y1="586" x2="850" y2="586" stroke="#16845B" stroke-width="2"/>
  </g>
  <g id="do-not-infer"><rect x="48" y="642" width="1184" height="42" fill="#D71920"/><text x="72" y="669" font-family="'Microsoft YaHei UI','Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">不要推断：秒完成、旧金额回退、前端生成风险、Permit 或模型调用事实。</text></g>
  <g id="footer"><text x="1232" y="710" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="16" fill="#0B3A70">P12</text></g>
</svg>

name: PostgreSQL restart evidence

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-agent-control-loop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: office_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d office_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_DSN: postgresql://agent:agent@127.0.0.1:5432/office_agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --frozen --all-groups
      - run: pnpm --dir apps/web install --frozen-lockfile --ignore-scripts
      - run: uv run pytest tests/integration/test_postgres_agent_control_loop.py -q
